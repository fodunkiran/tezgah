<title>İş Panosu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Layout: one column of wide lists in the order a person reads them: your turn (every project), now, milestones, up next, new; waiting, later and closed fold away. A card opens in a dialog. */
:root {
  --bg: #f2f4f3; --surface: #ffffff; --lane: #e6eae8; --ink: #17201d; --muted: #5a6662; --line: #d0d8d4;
  --hover: #f4f7f6; --sel: #d9eae4; --accent: #0e6b5b; --accent-ink: #ffffff; --scrim: rgba(12, 18, 16, .5);
  --turn-bg: #fff5df; --turn-line: #e8cf93;
  --new-bg: #ece6fa; --new-ink: #4c3299; --info-bg: #dfeafb; --info-ink: #1c4a8f;
  --warn-bg: #ffe9b8; --warn-ink: #6b4100; --bad-bg: #fde3e0; --bad-ink: #8f1d12;
  --ok-bg: #dff3e6; --ok-ink: #17603a; --idle-bg: #e3e8e6; --idle-ink: #48534f;
  --font-text: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-head: "IBM Plex Sans Condensed", "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", "Cascadia Mono", Consolas, ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --surface: #1d2522; --lane: #161c1a; --ink: #e6ece9; --muted: #9ba8a3; --line: #303b37;
    --hover: #232d29; --sel: #1d342d; --accent: #62c7b2; --accent-ink: #06211b; --scrim: rgba(0, 0, 0, .6);
    --turn-bg: #2a2110; --turn-line: #5b4718;
    --new-bg: #2a2342; --new-ink: #c6b8f4; --info-bg: #17293f; --info-ink: #9fc4f6;
    --warn-bg: #4a370f; --warn-ink: #f6d083; --bad-bg: #3f1d1a; --bad-ink: #f4a399;
    --ok-bg: #173225; --ok-ink: #92d6ab; --idle-bg: #29322f; --idle-ink: #b5c0bc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --surface: #1d2522; --lane: #161c1a; --ink: #e6ece9; --muted: #9ba8a3; --line: #303b37;
  --hover: #232d29; --sel: #1d342d; --accent: #62c7b2; --accent-ink: #06211b; --scrim: rgba(0, 0, 0, .6);
  --turn-bg: #2a2110; --turn-line: #5b4718;
  --new-bg: #2a2342; --new-ink: #c6b8f4; --info-bg: #17293f; --info-ink: #9fc4f6;
  --warn-bg: #4a370f; --warn-ink: #f6d083; --bad-bg: #3f1d1a; --bad-ink: #f4a399;
  --ok-bg: #173225; --ok-ink: #92d6ab; --idle-bg: #29322f; --idle-ink: #b5c0bc;
  color-scheme: dark;
}

body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-text); }
.wrap {
  padding-block: 24px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 120rem; margin: 0 auto; padding-inline: clamp(0px, 1.6vw, 40px); display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.ro .w-only { display: none; }
.hint { font-size: 13.5px; color: var(--muted); }
.hint.err { color: var(--bad-ink); }
.id { font: 500 13px/1.4 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* Header */
.top { display: flex; flex-wrap: wrap; gap: 16px 48px; align-items: flex-end; justify-content: space-between; }
.top-main { display: grid; gap: 8px; min-width: 0; flex: 1 1 28rem; }
.top-side { display: flex; flex-wrap: wrap; gap: 14px 32px; align-items: flex-end; }
.eyebrow { margin: 0; font: 500 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.projects { display: flex; flex-wrap: wrap; gap: 6px; }
h1 { margin: 0; font: 600 36px/1.05 var(--font-head); letter-spacing: -.01em; text-wrap: balance; }
.goal { margin: 0; max-width: 70ch; font-size: 17px; }
.goal.unset { color: var(--muted); }
.facts { display: flex; flex-wrap: wrap; gap: 10px 32px; margin: 0; }
.fact { display: grid; gap: 2px; }
.fact dt { font-size: 13px; color: var(--muted); }
.fact dd { margin: 0; font: 500 14px/1.3 var(--font-mono); font-variant-numeric: tabular-nums; }
.notice { margin: 0; padding: 10px 14px; border-radius: 6px; background: var(--warn-bg); color: var(--warn-ink); }

/* Summary and search */
.bar { display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: center; justify-content: space-between; padding-block: 12px; border-block: 1px solid var(--line); }
.summary { display: flex; flex-wrap: wrap; gap: 6px 26px; color: var(--muted); }
.sum b { margin-right: 6px; font: 600 17px/1 var(--font-text); font-variant-numeric: tabular-nums; color: var(--ink); }
.sum.hot, .sum.hot b { color: var(--warn-ink); }
.bar input { width: 18rem; max-width: 100%; }
.seg { padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted); font: 500 14px/1.2 var(--font-text); cursor: pointer; }
.seg:hover { background: var(--hover); color: var(--ink); }
.seg[aria-pressed="true"], .seg[aria-checked="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.seg .badge { margin-left: 8px; padding: 0 6px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-ink); font: 500 12px/1.5 var(--font-mono); }

/* Sections */
.sec { display: grid; gap: 10px; min-width: 0; }
.sec-head { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.sec h2, .sec summary { margin: 0; font: 600 19px/1.2 var(--font-head); letter-spacing: .01em; }
.count { margin-left: 6px; font: 500 14px/1 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.turn { padding: 16px; border: 1px solid var(--turn-line); border-radius: 12px; background: var(--turn-bg); }
details.sec { display: block; border-top: 1px solid var(--line); padding-top: 14px; }
details.sec > summary { cursor: pointer; list-style-position: inside; }
details.sec > summary .hint { font: 400 13.5px/1.4 var(--font-text); margin-left: 10px; }
details.sec[open] > summary { margin-bottom: 10px; }
.cards { position: relative; display: grid; gap: 6px; min-width: 0; }
.empty { margin: 0; padding: 4px 2px; color: var(--muted); font-size: 14.5px; }
.drop-line { position: absolute; left: 0; right: 0; height: 3px; border-radius: 2px; background: var(--accent); pointer-events: none; }
.waves { display: grid; gap: 6px; }
.wave { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 10px 14px; border: 1px dashed var(--line); border-radius: 8px; }
.wave b { font-weight: 500; }

/* Milestones */
.ms-list { display: grid; gap: 6px; }
.ms { box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) minmax(8rem, 18rem) auto; gap: 6px 18px; align-items: center; width: 100%; padding: 12px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.ms:hover { background: var(--hover); }
.ms[aria-pressed="true"] { border-color: var(--accent); background: var(--sel); }
.ms-title { font-weight: 600; overflow-wrap: anywhere; }
.ms-exit { grid-column: 1 / -1; margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
.track { height: 6px; border-radius: 3px; background: var(--lane); overflow: hidden; }
.fill { height: 100%; background: var(--accent); }
.ms-num { font: 500 13px/1.3 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Cards: one wide row each */
.card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: start; min-width: 0; padding: 11px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.card.ranked { grid-template-columns: 2.5ch minmax(0, 1fr) auto; }
.card:hover { border-color: var(--muted); background: var(--hover); }
.card.dragging { opacity: .4; }
.rank { font: 500 14px/1.6 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.card-body { display: grid; gap: 3px; min-width: 0; justify-items: start; }
.card-title { font-weight: 500; line-height: 1.4; overflow-wrap: anywhere; }
.card-title.struck { color: var(--muted); text-decoration: line-through; }
.closed-list .card-title { font-weight: 400; color: var(--muted); }
.card-note, .card-reply { font-size: 14.5px; color: var(--muted); overflow-wrap: anywhere; }
.turn .card-note { color: var(--ink); }
.side { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; justify-content: flex-end; max-width: 30rem; }
.chip { padding: 0 7px; border: 1px solid var(--line); border-radius: 4px; font-size: 13px; line-height: 1.6; color: var(--muted); white-space: nowrap; }
.chip.soft { border-color: transparent; background: var(--idle-bg); color: var(--idle-ink); }
.chip.proj { border-color: var(--ink); color: var(--ink); }
.when { font-size: 13px; color: var(--muted); white-space: nowrap; }
.when.hot { color: var(--warn-ink); }
.mark { display: inline-flex; color: var(--muted); }
.cta { padding: 3px 12px; border-radius: 999px; background: var(--ink); color: var(--bg); font: 500 13.5px/1.5 var(--font-text); }
.pill { padding: 1px 10px; border-radius: 999px; font: 500 13px/1.6 var(--font-text); white-space: nowrap; }
.st-new { background: var(--new-bg); color: var(--new-ink); }
.st-info { background: var(--info-bg); color: var(--info-ink); }
.st-warn { background: var(--warn-bg); color: var(--warn-ink); }
.st-bad { background: var(--bad-bg); color: var(--bad-ink); }
.st-ok { background: var(--ok-bg); color: var(--ok-ink); }
.st-idle { background: var(--idle-bg); color: var(--idle-ink); }
@media (prefers-reduced-motion: no-preference) {
  .card.flash { animation: flash 1.4s ease-out; }
  @keyframes flash { from { background: var(--sel); border-color: var(--accent); } }
}
@media (max-width: 720px) {
  .card, .card.ranked { grid-template-columns: minmax(0, 1fr); }
  .card.ranked { grid-template-columns: 2.5ch minmax(0, 1fr); }
  .card .side { grid-column: -2 / -1; justify-content: flex-start; }
  .ms { grid-template-columns: minmax(0, 1fr) auto; }
  .ms .track { grid-column: 1 / -1; grid-row: 2; }
  .ms-num { white-space: normal; text-align: right; }
}

/* Controls */
input[type="text"], input[type="search"], textarea, select { box-sizing: border-box; width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; }
textarea { resize: vertical; line-height: 1.5; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 1; }
.btn { padding: 9px 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: 500 15px/1.2 var(--font-text); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
.btn.quiet:hover { background: var(--hover); color: var(--ink); }
.btn.danger { color: var(--bad-ink); }
.btn:disabled, input:disabled, textarea:disabled, select:disabled { opacity: .55; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.composer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: start; }
.composer textarea { resize: none; }
.composer .hint { grid-column: 1 / -1; }

/* Dialogs */
dialog { box-sizing: border-box; width: min(48rem, calc(100vw - 32px)); max-height: calc(100vh - 48px); max-height: calc(100dvh - 48px); padding: 0; overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font: 16px/1.5 var(--font-text); }
dialog::backdrop { background: var(--scrim); }
.sheet { display: grid; gap: 18px; padding: 24px; }
.sheet-head { display: flex; align-items: center; gap: 14px; }
.sheet-head .btn { margin-left: auto; }
.title-input { padding: 6px 10px; margin-inline: -10px; width: calc(100% + 20px); border-color: transparent; resize: none; overflow: hidden; font: 600 24px/1.25 var(--font-head); }
.title-input:hover, .title-input:focus { border-color: var(--line); }
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .label { font-weight: 500; font-size: 15px; }
.seg-row { display: flex; flex-wrap: wrap; gap: 6px; }
.duo { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: 18px; align-items: start; }
.quote { display: grid; gap: 4px; padding: 12px 14px; border-radius: 8px; background: var(--lane); }
.quote p { margin: 0; overflow-wrap: anywhere; }
.fold { border-top: 1px solid var(--line); padding-top: 14px; }
.fold summary { cursor: pointer; font-weight: 500; font-size: 15px; }
.fold summary .hint { font-weight: 400; }
.fold-body { display: grid; gap: 16px; padding-top: 14px; }
.sheet-foot { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding-top: 14px; border-top: 1px solid var(--line); }
.del { margin-left: auto; display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
.dlg-title { margin: 0; font: 600 22px/1.2 var(--font-head); }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }
.foot { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; justify-content: space-between; margin: 8px 0 0; color: var(--muted); font-size: 14px; }
.foot p { margin: 0; max-width: 80ch; }

@media (max-width: 600px) {
  h1 { font-size: 30px; }
  .bar input { width: 100%; }
  dialog { width: 100vw; max-width: none; height: 100vh; height: 100dvh; max-height: none; margin: 0; border: 0; border-radius: 0; }
  .sheet { padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px)); }
}
</style>

<div class="wrap" id="wrap">
  <div class="page">
    <header class="top">
      <div class="top-main">
        <p class="eyebrow" data-t="eyebrow"></p>
        <nav id="projects" class="projects" aria-label="Projects"></nav>
        <h1 id="project-name"></h1>
        <p id="goal" class="goal unset"></p>
      </div>
      <div class="top-side">
        <dl id="facts" class="facts"></dl>
        <div class="tools">
          <button type="button" id="export" class="btn" data-t="export" hidden></button>
          <button type="button" id="edit-project" class="btn w-only" data-t="editProject" hidden></button>
        </div>
      </div>
    </header>

    <p id="notice" class="notice" role="status" hidden></p>

    <form id="add-form" class="composer w-only" autocomplete="off">
      <label class="sr" for="add-title" data-t="inbox"></label>
      <textarea id="add-title" rows="1" maxlength="4000" data-tp="newPh" disabled></textarea>
      <button type="submit" id="add-btn" class="btn primary" data-t="add" disabled></button>
      <span class="hint" data-t="newHint"></span>
    </form>

    <div class="bar">
      <div id="summary" class="summary"></div>
      <label class="sr" for="q" data-t="search"></label>
      <input id="q" type="search" data-tp="search" autocomplete="off">
    </div>

    <section id="turn" class="sec turn" aria-labelledby="h-turn" hidden>
      <div class="sec-head">
        <h2 id="h-turn"><span data-t="turn"></span><span class="count" id="count-turn"></span></h2>
        <span class="hint" data-t="turnHint"></span>
      </div>
      <div class="cards" id="cards-turn"></div>
    </section>

    <section class="sec" aria-labelledby="h-now">
      <div class="sec-head"><h2 id="h-now"><span data-t="now"></span><span class="count" id="count-now"></span></h2></div>
      <div class="waves" id="waves"></div>
      <div class="cards" id="cards-now"></div>
    </section>

    <section id="sec-ms" class="sec" aria-labelledby="h-ms" hidden>
      <div class="sec-head">
        <h2 id="h-ms" data-t="milestones"></h2>
        <span class="hint" data-t="msHint"></span>
      </div>
      <div class="ms-list" id="ms-list"></div>
    </section>

    <section class="sec" aria-labelledby="h-queue">
      <div class="sec-head">
        <h2 id="h-queue"><span data-t="queue"></span><span class="count" id="count-queue"></span></h2>
        <span class="hint w-only" data-t="queueHint"></span>
      </div>
      <div class="cards" id="cards-queue"></div>
    </section>

    <section class="sec" aria-labelledby="h-inbox">
      <div class="sec-head">
        <h2 id="h-inbox"><span data-t="inbox"></span><span class="count" id="count-inbox"></span></h2>
        <span class="hint" data-t="inboxHint"></span>
      </div>
      <div class="cards" id="cards-inbox"></div>
    </section>

    <details class="sec" id="fold-external">
      <summary><span data-t="external"></span><span class="count" id="count-external"></span></summary>
      <div class="cards" id="cards-external"></div>
    </details>

    <details class="sec" id="fold-later">
      <summary><span data-t="later"></span><span class="count" id="count-later"></span><span class="hint" data-t="laterHint"></span></summary>
      <div class="cards" id="cards-later"></div>
    </details>

    <details class="sec" id="fold-closed">
      <summary><span data-t="closed"></span><span class="count" id="count-closed"></span></summary>
      <div class="cards closed-list" id="cards-closed"></div>
      <button type="button" id="more-closed" class="btn quiet" data-t="more" hidden></button>
    </details>

    <div class="foot">
      <p data-t="foot"></p>
      <button type="button" id="lang" class="btn quiet"></button>
    </div>
  </div>
</div>

<dialog id="card-dialog" tabindex="-1">
  <form id="detail-form" class="sheet" autocomplete="off">
    <div class="sheet-head">
      <span id="detail-id" class="id"></span>
      <span id="save-state" class="hint" role="status"></span>
      <button type="button" id="detail-close" class="btn quiet" data-t="close"></button>
    </div>
    <label class="sr" for="f-title" data-t="title"></label>
    <textarea id="f-title" class="title-input" rows="1" maxlength="160"></textarea>

    <div class="field">
      <span class="label" id="status-label" data-t="status"></span>
      <div id="f-status" class="seg-row" role="radiogroup" aria-labelledby="status-label"></div>
    </div>

    <div class="duo">
      <div class="field">
        <span class="label" id="ball-label" data-t="ball"></span>
        <div id="f-ball" class="seg-row" role="radiogroup" aria-labelledby="ball-label"></div>
      </div>
      <div id="waiting-field" class="field" hidden>
        <label for="f-waiting" data-t="waiting"></label>
        <input id="f-waiting" type="text" maxlength="80">
      </div>
    </div>

    <div id="agent-note" class="quote" hidden>
      <span class="label" data-t="agentNote"></span>
      <p id="agent-note-text"></p>
    </div>

    <div id="reply-field" class="field" hidden>
      <label for="f-reply" data-t="reply"></label>
      <textarea id="f-reply" rows="2" maxlength="600"></textarea>
      <span class="hint" data-t="replyHint"></span>
    </div>

    <div class="field">
      <label for="f-brief" data-t="brief"></label>
      <textarea id="f-brief" rows="10" maxlength="20000"></textarea>
      <span class="hint" data-t="briefHint"></span>
    </div>

    <div class="duo">
      <div class="field">
        <label for="f-milestone" data-t="milestone"></label>
        <select id="f-milestone"></select>
      </div>
      <div class="field">
        <label for="f-area" data-t="area"></label>
        <input id="f-area" type="text" maxlength="40" list="area-list">
        <datalist id="area-list"></datalist>
      </div>
      <div class="field">
        <label for="f-kind" data-t="kind"></label>
        <select id="f-kind"></select>
      </div>
    </div>

    <div id="move-row" class="field w-only" hidden>
      <span class="label" data-t="place"></span>
      <div class="tools">
        <button type="button" class="btn" id="mv-top" data-t="toTop"></button>
        <button type="button" class="btn" id="mv-up" data-t="up"></button>
        <button type="button" class="btn" id="mv-down" data-t="down"></button>
      </div>
    </div>

    <details class="fold" id="agent-fields">
      <summary><span data-t="agentFields"></span><span id="fold-sum" class="hint"></span></summary>
      <div class="fold-body">
        <div class="field">
          <label for="f-note" data-t="note"></label>
          <input id="f-note" type="text" maxlength="240">
          <span class="hint" data-t="noteHint"></span>
        </div>
        <div class="duo">
          <div class="field">
            <label for="f-owner" data-t="owner"></label>
            <input id="f-owner" type="text" maxlength="60">
          </div>
          <div class="field">
            <label for="f-prs" data-t="prs"></label>
            <input id="f-prs" type="text" maxlength="120" placeholder="412, 415">
          </div>
        </div>
        <div class="duo">
          <div class="field">
            <label for="f-deps" data-t="deps"></label>

      replyCta: "Answer", yourReply: (r) => "Your answer: " + r + " (an agent reads it next session)",
      after: (ids) => "after " + ids, waitingOn: (w) => "waiting on " + w,
      waited: (n) => (n <= 0 ? "today" : n === 1 ? "waiting 1 day" : "waiting " + n + " days"),
      running: (n) => (n <= 0 ? "started today" : n === 1 ? "since yesterday" : "for " + n + " days"),
      daysLeft: (n) => (n === 0 ? "today" : n === 1 ? "tomorrow" : n > 1 ? n + " days left" : -n + " days late"),
      progress: (d, all) => d + " of " + all + " closed",
      untitled: "(untitled)", hasBrief: "has a description", wave: "Wave",
      waveState: { planning: "planning", running: "running", landing: "landing", closed: "closed" },
      status: "Status", ball: "Whose move", waiting: "Waiting on", agentNote: "Agent's note",
      reply: "Your answer", replyHint: "An agent reads it next session. For a step that cannot be undone, such as a merge, it still asks in the chat.",
      brief: "What is wanted?", briefHint: "Write it as it comes. An agent reads it when it takes the card; it adds structure and keeps your sentences.",
      milestone: "Milestone", none: "None", area: "Area", kind: "Kind",
      place: "Place in queue", toTop: "To top", up: "Up", down: "Down",
      agentFields: "Filled in by agents", note: "Status note", noteHint: "One sentence: what came out, what it waits for, why it is stuck.",
      owner: "Taken by", prs: "Pull requests", deps: "Must close first", reqs: "Requirements and decisions",
      depsSelf: "A card cannot wait on itself.", close: "Close", title: "Title",
      del: "Delete", delAsk: "Delete this card?", delYes: "Yes, delete", cancel: "Cancel", save: "Save",
      saved: (t) => "Saved " + t,
      byAgent: "Added by an agent", byUser: "Added by you", opened: "opened", started: "started", closedOn: "closed",
      pName: "Project name", pGoal: "Current goal", pGoalHint: "One sentence. Every agent reads it at the start of a session.",
      pCounters: "Next free numbers", pCountersHint: "One “name = number” per line. Parallel sessions reserve their numbers here.",
      pErr: "Each line must read “name = number”.",
      noDb: "This view cannot reach the board's data. Open the page on claude.ai while signed in.",
      slow: "The data cannot be reached yet. The board fills in by itself once it connects.",
      dead: "The board's data cannot be reached right now.",
      wFull: "The board is full. Delete or archive old cards to add new ones.",
      wDenied: "Not saved: this view may not be allowed to write to the board.",
      wFail: "Not saved. Try again once the connection is back.",
      exNo: "This view cannot save files.", exBusy: "Exporting…", exDone: "Exported.",
      exTrunc: "A collection passed 1,000 documents; the file may be incomplete.",
      st: { inbox: "New", todo: "Up next", doing: "In progress", review: "Needs your OK", blocked: "Stuck", later: "Later", done: "Done", dropped: "Dropped" },
      balls: { agent: "Agent", user: "You", external: "Someone else" },
      kinds: { feature: "Feature", fix: "Fix", debt: "Debt", decision: "Decision", chore: "Chore", research: "Research" },
    },
  };
  let lang = "tr";
  try {
    const saved = localStorage.getItem("pano.lang");
    lang = saved === "en" || saved === "tr" ? saved : /^tr\b/i.test(navigator.language || "tr") ? "tr" : "en";
  } catch (e) { lang = /^tr\b/i.test(navigator.language || "tr") ? "tr" : "en"; }
  const t = (k, ...a) => {
    const v = I18N[lang][k] !== undefined ? I18N[lang][k] : I18N.tr[k];
    return typeof v === "function" ? v(...a) : v;
  };

  /* ---------- the schema the page draws (reference/schema.md) ---------- */
  const STATUS_CLS = { inbox: "st-new", todo: "st-idle", doing: "st-info", review: "st-warn", blocked: "st-bad", later: "st-idle", done: "st-ok", dropped: "st-idle" };
  const STATUSES = Object.keys(STATUS_CLS);
  const OPEN = ["inbox", "todo", "doing", "review", "blocked"];
  const BALLS = ["agent", "user", "external"];
  const KINDS = ["feature", "fix", "debt", "decision", "chore", "research"];
  const CLOSED_PAGE = 30;
  const $ = (id) => document.getElementById(id);
  const wrap = $("wrap");
  const dlg = $("card-dialog");

  const statusOf = (c) => (STATUS_CLS[c.status] ? c.status : "inbox");
  const isClosed = (c) => c.status === "done" || c.status === "dropped";
  // Old cards carry no `ball`: a review or blocked card was the user's move.
  const ballOf = (c) => (BALLS.includes(c.ball) ? c.ball : c.status === "review" || c.status === "blocked" ? "user" : "agent");
  const num = (id) => { const m = /^t(\d+)$/.exec(id); return m ? Number(m[1]) : Infinity; };
  const byNum = (a, b) => num(a[0]) - num(b[0]) || a[0].localeCompare(b[0]);
  const ord = (c) => (Number.isFinite(Number(c.order)) ? Number(c.order) : 0);
  const byOrder = (a, b) => ord(a[1]) - ord(b[1]) || byNum(a, b);
  const day = (c, k) => String(c[k] || "");
  const byDay = (k, dir) => (a, b) => dir * day(a[1], k).localeCompare(day(b[1], k)) || byNum(a, b);
  const asList = (v) => (Array.isArray(v) ? v.map(String) : v == null || v === "" ? [] : [String(v)]);

  const state = {
    db: null, canWrite: true, loaded: false,
    projects: new Map(), projectsLoaded: false, key: null,
    project: null, projectLoaded: false,
    milestones: new Map(), waves: new Map(), msDone: new Map(),
    open: new Map(), later: new Map(), closed: new Map(),
    laterOn: false, closedOn: false, closedLimit: CLOSED_PAGE, closedFull: false,
    turn: new Map(),             // key -> Map(id -> card): ball = user in every project
    q: "", ms: "", sel: null, flash: null,
    briefUnsub: null, briefText: "", briefDirty: false,
  };
  const subs = { turn: new Map(), project: [], later: null, closed: null, msDone: new Map() };

  /* ---------- small helpers ---------- */
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function today() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function parseDay(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || "");
    return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : null;
  }
  function daysFrom(d) {
    const now = new Date();
    return Math.round((d - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
  }
  const fmt = (d, long) => new Intl.DateTimeFormat(t("locale"), long ? { day: "numeric", month: "long", year: "numeric" } : { day: "numeric", month: "short" }).format(d);
  function same(a, b) {
    const base = Array.isArray(b) ? [] : typeof b === "boolean" ? false : "";
    return JSON.stringify(a == null ? base : a) === JSON.stringify(b);
  }
  function grow(ta, max) {
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight + 2, max) + "px";
  }
  function pref(k, v) {
    try {
      if (v === undefined) return localStorage.getItem("pano." + k);
      localStorage.setItem("pano." + k, v);
    } catch (e) { /* storage may be blocked */ }
    return null;
  }
  let noticeKind = "";
  function say(kind, msg) {
    noticeKind = msg ? kind : "";
    $("notice").textContent = msg || "";
    $("notice").hidden = !msg;
  }
  const pPath = (key) => "projects/" + key;
  const taskPath = (key, id) => pPath(key) + "/tasks/" + id;
  const briefPath = (key, id) => pPath(key) + "/briefs/" + id;
  const projName = (key) => {
    const p = state.projects.get(key);
    return (p && p.name) || key;
  };

  /* ---------- derived views ---------- */
  function cardOf(key, id) {
    if (key === state.key) {
      for (const m of [state.open, state.later, state.closed]) if (m.has(id)) return m.get(id);
    }
    const tm = state.turn.get(key);
    return tm && tm.has(id) ? tm.get(id) : null;
  }
  function matches(id, c) {
    if (state.ms && String(c.milestone || "") !== state.ms) return false;
    if (!state.q) return true;
    const ms = c.milestone && state.milestones.get(c.milestone);
    const hay = [id, c.title, c.note, c.reply, c.area, c.owner, c.waiting, ms && ms.title, asList(c.prs).join(" "), asList(c.reqs).join(" ")]
      .filter(Boolean).join(" ").toLocaleLowerCase(t("locale"));
    return hay.includes(state.q);
  }
  // Each open card of the shown project lands in exactly one list.
  function sectionOf(c) {
    const b = ballOf(c);
    if (b === "user") return "turn";
    if (b === "external") return "external";
    const s = statusOf(c);
    if (s === "doing") return "now";
    if (s === "todo") return "queue";
    if (s === "review" || s === "blocked") return "turn";
    return "inbox";
  }
  function listOf(sec, all) {
    const out = [];
    for (const [id, c] of state.open) {
      if (sectionOf(c) !== sec || (!all && !matches(id, c))) continue;
      out.push([id, c]);
    }
    const sort = sec === "queue" ? byOrder : sec === "now" ? byDay("started", 1) : sec === "inbox" ? byNum : byDay("at", 1);
    return out.sort(sort);
  }
  // Your turn: every project's ball = user cards, plus the shown project's old review/blocked cards.
  function turnList() {
    const seen = new Map();
    for (const [key, m] of state.turn) {
      for (const [id, c] of m) if (!isClosed(c)) seen.set(key + "/" + id, { key, id, c });
    }
    if (state.key) {
      for (const [id, c] of state.open) {
        const k = state.key + "/" + id;
        if (sectionOf(c) === "turn") seen.set(k, { key: state.key, id, c });
        else seen.delete(k);
      }
    }
    return [...seen.values()]
      .filter((x) => x.key !== state.key || matches(x.id, x.c))
      .sort((a, b) => day(a.c, "at").localeCompare(day(b.c, "at")) || num(a.id) - num(b.id));
  }
  function waitingOn(c) {
    return asList(c.deps).filter((d) => {
      const x = cardOf(state.key, d);
      return !x || !isClosed(x);
    });
  }

  /* ---------- render ---------- */
  function applyStatic() {
    document.documentElement.lang = lang;
    for (const n of document.querySelectorAll("[data-t]")) n.textContent = t(n.dataset.t);

    const kind = $("f-kind");
    kind.replaceChildren(new Option("—", ""), ...KINDS.map((k) => new Option(t("kinds")[k], k)));

      box.replaceChildren(...keys.map((k) => {
        const b = el("button", "seg", labels[k]);
        b.type = "button";
        b.setAttribute("role", "radio");
        b.dataset[data] = k;
        return b;
      }));
    };
    mkSeg($("f-status"), STATUSES, t("st"), "status");
    mkSeg($("f-ball"), BALLS, t("balls"), "ball");
  }

  function renderProjects() {
    const box = $("projects");
    const keys = [...state.projects.keys()].sort((a, b) => projName(a).localeCompare(projName(b), t("locale")));
    box.hidden = keys.length < 2;
    box.replaceChildren(...keys.map((key) => {
      const b = el("button", "seg", projName(key));
      b.type = "button";
      b.dataset.key = key;
      b.setAttribute("aria-pressed", String(key === state.key));
      const n = [...(state.turn.get(key) || new Map()).values()].filter((c) => !isClosed(c)).length;
      if (n) b.append(el("span", "badge", String(n)));
      return b;
    }));
  }

  function renderHeader() {
    const p = state.project || {};
    const has = !!state.key;
    $("project-name").textContent = has ? p.name || state.key : t("eyebrow");
    const g = $("goal");
    if (!state.projectsLoaded || (has && !state.projectLoaded)) g.textContent = t("loading");
    else if (!has) g.textContent = t("noProjects");
    else g.textContent = p.goal || t("noGoal");
    g.classList.toggle("unset", !(has && p.goal));
    $("export").hidden = !has;
    $("edit-project").hidden = !has;
    const dl = $("facts");
    dl.replaceChildren();
    const cs = Object.entries(p.counters || {});
    if (cs.length) {
      const d = el("div", "fact");
      d.append(el("dt", null, t("counters")), el("dd", null, cs.map(([k, v]) => k + " " + v).join(" · ")));
      dl.append(d);
    }
  }

  function renderSummary() {
    const box = $("summary");
    box.replaceChildren();
    if (!state.loaded) return;
    const add = (count, label, hot) => {
      const s = el("span", "sum" + (hot ? " hot" : ""));
      s.append(el("b", null, String(count)), document.createTextNode(label));
      box.append(s);
    };
    const waits = turnList().filter((x) => !x.c.reply).length;
    if (waits) add(waits, t("sumWait"), true);
    else box.append(el("span", "sum", t("sumNone")));
    add(listOf("now").length, t("sumDoing"));
    add(listOf("queue").length, t("sumTodo"));
    add(listOf("inbox").length, t("sumInbox"));
  }

  const BRIEF_MARK = '<svg viewBox="0 0 12 12" width="13" height="13" aria-hidden="true"><path d="M1 2.5h10M1 6h10M1 9.5h6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';

  function cardEl(key, id, c, sec, rank) {
    const st = statusOf(c);
    const row = el("div", "card" + (sec === "queue" ? " ranked" : ""));
    row.setAttribute("role", "button");
    row.tabIndex = 0;
    row.dataset.key = key;
    row.dataset.id = id;
    if (state.canWrite && key === state.key && ["queue", "inbox", "later"].includes(sec)) row.draggable = true;
    if (key + "/" + id === state.flash) row.classList.add("flash");
    if (sec === "queue") row.append(el("span", "rank", String(rank)));
    const body = el("div", "card-body");
    if (sec === "turn" || sec === "external") body.append(el("span", "pill " + STATUS_CLS[st], t("st")[st]));
    const title = el("span", "card-title", c.title || t("untitled"));
    if (st === "dropped") title.classList.add("struck");
    body.append(title);
    if (c.note) body.append(el("span", "card-note", String(c.note)));
    if (sec === "turn") {
      if (c.reply) body.append(el("span", "card-reply", t("yourReply", c.reply)));
      else if (state.canWrite) body.append(el("span", "cta", t("replyCta")));
    }
    row.append(body);

    const side = el("span", "side");
    if (sec === "turn" && (key !== state.key || state.projects.size > 1)) side.append(el("span", "chip proj", projName(key)));
    side.append(el("span", "id", id));
    const ms = key === state.key && c.milestone ? state.milestones.get(c.milestone) : null;
    if (ms) side.append(el("span", "chip", String(ms.title || c.milestone)));
    if (c.area) side.append(el("span", "chip", String(c.area)));
    if (c.kind && t("kinds")[c.kind]) side.append(el("span", "chip soft", t("kinds")[c.kind]));
    const waits = isClosed(c) || key !== state.key ? [] : waitingOn(c);
    if (waits.length) side.append(el("span", "chip soft", t("after", waits.join(", "))));
    if (c.waiting && ballOf(c) === "external") side.append(el("span", "chip soft", t("waitingOn", c.waiting)));
    if (c.owner) side.append(el("span", "chip", String(c.owner)));
    for (const pr of asList(c.prs)) side.append(el("span", "chip", "#" + pr.replace(/^#/, "")));
    const at = parseDay(c.at);
    if (sec === "turn" && at) {
      const n = -daysFrom(at);
      side.append(el("span", "when" + (n >= 3 ? " hot" : ""), t("waited", n)));
    }
    const started = parseDay(c.started) || at;
    if (sec === "now" && started) side.append(el("span", "when", t("running", -daysFrom(started))));
    const closedDay = parseDay(c.closed) || at;
    if (sec === "closed" && closedDay) side.append(el("span", "when", fmt(closedDay)));
    if (st === "dropped") side.append(el("span", "pill st-idle", t("st").dropped));
    if (c.brief) {
      const m = el("span", "mark");
      m.innerHTML = BRIEF_MARK;
      m.title = t("hasBrief");
      m.append(el("span", "sr", t("hasBrief")));
      side.append(m);
    }
    row.append(side);
    return row;
  }

  function fill(boxId, items, sec, emptyKey) {
    const frag = document.createDocumentFragment();
    if (!state.loaded) frag.append(el("p", "empty", t("loading")));
    else if (!items.length) frag.append(el("p", "empty", state.q || state.ms ? t("filterEmpty") : t(emptyKey)));
    else items.forEach((x, i) => frag.append(cardEl(x.key || state.key, x.id || x[0], x.c || x[1], sec, i + 1)));
    $(boxId).replaceChildren(frag);
  }

  function renderWaves() {
    const box = $("waves");
    box.replaceChildren();
    const list = [...state.waves.entries()].filter(([, w]) => w.state !== "closed")
      .sort((a, b) => String(a[1].at || "").localeCompare(String(b[1].at || "")));
    for (const [id, w] of list) {
      const r = el("div", "wave");
      r.append(el("span", "id", t("wave") + " " + id), el("b", null, String(w.title || "")));
      if (w.state) r.append(el("span", "pill st-info", t("waveState")[w.state] || String(w.state)));
      const cards = asList(w.cards);
      if (cards.length) r.append(el("span", "hint", cards.join(", ")));
      if (w.note) r.append(el("span", "hint", String(w.note)));
      box.append(r);
    }
  }

  function renderMilestones() {
    const list = [...state.milestones.entries()].filter(([, m]) => m.state !== "closed")
      .sort((a, b) => ord(a[1]) - ord(b[1]) || a[0].localeCompare(b[0]));
    if (state.ms && !state.milestones.has(state.ms)) state.ms = "";
    $("sec-ms").hidden = !list.length;
    const box = $("ms-list");
    box.replaceChildren(...list.map(([id, m]) => {
      let open = 0;
      for (const c of state.open.values()) if (c.milestone === id) open += 1;
      for (const c of state.later.values()) if (c.milestone === id) open += 1;
      const done = state.msDone.get(id) || 0;
      const all = open + done;
      const b = el("div", "ms");
      b.setAttribute("role", "button");
      b.tabIndex = 0;
      b.dataset.ms = id;
      b.setAttribute("aria-pressed", String(state.ms === id));
      const head = el("span", "ms-title", String(m.title || id));
      const due = parseDay(m.due);
      const track = el("span", "track");
      const f = el("span", "fill");
      f.style.width = (all ? Math.round((done / all) * 100) : 0) + "%";
      track.append(f);
      const numEl = el("span", "ms-num", t("progress", done, all) + (due ? " · " + fmt(due) + " · " + t("daysLeft", daysFrom(due)) : ""));
      b.append(head, track, numEl);
      const exit = asList(m.exit);
      if (exit.length) {
        const ul = el("ul", "ms-exit");
        for (const e of exit) ul.append(el("li", null, e));
        b.append(ul);
      }
      return b;
    }));
  }

  function renderLists() {
    const active = document.activeElement;
    const focus = active && active.classList && active.classList.contains("card") ? active.dataset.key + "/" + active.dataset.id : null;

    const turn = turnList();
    $("turn").hidden = !state.loaded || !turn.length;
    $("count-turn").textContent = String(turn.length);
    fill("cards-turn", turn, "turn", "sumNone");

    const sets = { now: "nowEmpty", queue: "queueEmpty", inbox: "inboxEmpty", external: "externalEmpty" };
    for (const sec of Object.keys(sets)) {
      const items = listOf(sec);
      $("count-" + sec).textContent = state.loaded ? String(items.length) : "";
      fill("cards-" + sec, items, sec, sets[sec]);
    }
    const later = [...state.later.entries()].filter(([id, c]) => statusOf(c) === "later" && matches(id, c)).sort(byOrder);
    $("count-later").textContent = state.laterOn ? String(later.length) : "";
    fill("cards-later", later, "later", "laterEmpty");
    const closed = [...state.closed.entries()].filter(([id, c]) => isClosed(c) && matches(id, c))
      .sort((a, b) => -day(a[1], "closed").localeCompare(day(b[1], "closed")) || -day(a[1], "at").localeCompare(day(b[1], "at")) || num(b[0]) - num(a[0]));
    $("count-closed").textContent = state.closedOn ? String(closed.length) + (state.closedFull ? "+" : "") : "";
    fill("cards-closed", closed, "closed", "closedEmpty");
    $("more-closed").hidden = !state.closedOn || !state.closedFull;

    const ready = state.loaded && !!state.db && state.canWrite && !!state.key;
    $("add-title").disabled = !ready;
    $("add-btn").disabled = !ready;
    if (focus) {
      const [k, i] = focus.split("/");
      const r = document.querySelector('.card[data-key="' + CSS.escape(k) + '"][data-id="' + CSS.escape(i) + '"]');
      if (r) r.focus({ preventScroll: true });
    }
  }

  function render() {
    renderProjects();
    renderHeader();
    renderSummary();
    renderWaves();
    renderMilestones();
    renderLists();
    fillDetail(false);
  }

  /* ---------- the card dialog ---------- */
  function setVal(id, v, force) {
    const f = $(id);
    if ((force || document.activeElement !== f) && f.value !== v) f.value = v;
  }
  function fillDetail(force) {
    const s = state.sel;
    if (!s) return;
    const c = cardOf(s.key, s.id);
    if (!c) { if (state.loaded) deselect(); return; }
    const st = statusOf(c);
    const ball = ballOf(c);
    const here = s.key === state.key;
    $("detail-id").textContent = (s.key !== state.key || state.projects.size > 1 ? projName(s.key) + " · " : "") + s.id;
    setVal("f-title", String(c.title || ""), force);
    grow($("f-title"), 240);
    for (const b of $("f-status").querySelectorAll("[data-status]")) b.setAttribute("aria-checked", String(b.dataset.status === st));
    for (const b of $("f-ball").querySelectorAll("[data-ball]")) b.setAttribute("aria-checked", String(b.dataset.ball === ball));
    $("waiting-field").hidden = ball !== "external";
    setVal("f-waiting", String(c.waiting || ""), force);
    $("agent-note").hidden = !c.note;
    $("agent-note-text").textContent = String(c.note || "");
    $("reply-field").hidden = !(ball === "user" || c.reply || document.activeElement === $("f-reply"));
    setVal("f-reply", String(c.reply || ""), force);

    const msSel = $("f-milestone");
    const opts = [["", t("none")], ...[...state.milestones.entries()]
      .filter(([id, m]) => m.state !== "closed" || id === c.milestone)
      .sort((a, b) => ord(a[1]) - ord(b[1])).map(([id, m]) => [id, String(m.title || id)])];
    if (c.milestone && !opts.some((o) => o[0] === c.milestone)) opts.push([c.milestone, c.milestone]);
    if (force || document.activeElement !== msSel) {
      msSel.replaceChildren(...opts.map(([v, l]) => new Option(l, v)));
      msSel.value = c.milestone || "";
    }
    msSel.disabled = !here || !state.canWrite;
    setVal("f-area", String(c.area || ""), force);
    const areas = new Set();
    for (const m of [state.open, state.later, state.closed]) for (const x of m.values()) if (x.area) areas.add(String(x.area));
    $("area-list").replaceChildren(...[...areas].sort().map((a) => new Option(a)));
    setVal("f-kind", KINDS.includes(c.kind) ? c.kind : "", force);
    setVal("f-owner", String(c.owner || ""), force);
    setVal("f-prs", asList(c.prs).join(", "), force);
    setVal("f-deps", asList(c.deps).join(", "), force);
    setVal("f-reqs", asList(c.reqs).join(", "), force);
    setVal("f-note", String(c.note || ""), force);
    $("move-row").hidden = !here || sectionOf(c) !== "queue";

    const waits = isClosed(c) || !here ? [] : waitingOn(c);
    const parts = [c.owner, asList(c.prs).map((p) => "#" + p).join(" "), waits.length ? t("after", waits.join(", ")) : ""].filter(Boolean);
    $("fold-sum").textContent = parts.length ? " · " + parts.join(" · ") : "";
    const who = c.src === "agent" ? t("byAgent") : c.src === "user" ? t("byUser") : "";
    const days = [["created", "opened"], ["started", "started"], ["closed", "closedOn"]]
      .map(([k, l]) => (parseDay(c[k]) ? t(l) + " " + fmt(parseDay(c[k])) : "")).filter(Boolean);
    $("detail-meta").textContent = [who, ...days].filter(Boolean).join(" · ");
  }

  /* ---------- writes: one at a time per document ---------- */
  const chains = new Map();
  function write(path, fn) {
    const run = (chains.get(path) || Promise.resolve()).then(fn);
    chains.set(path, run.catch(() => {}));
    run.then(() => {
      $("save-state").textContent = t("saved", new Date().toLocaleTimeString(t("locale"), { hour: "2-digit", minute: "2-digit" }));
      if (noticeKind === "write") say("write", "");
    }, (e) => {
      const code = e && e.code;
      if (code === "quota_exceeded") say("write", t("wFull"));
      else if (code === "invalid_argument" || code === "not_granted" || code === "revoked") say("write", t("wDenied"));
      else say("write", t("wFail"));
    });
    return run;
  }
  const patchTask = (key, id, patch) => write(taskPath(key, id), () => state.db.doc(taskPath(key, id)).update(patch));
  const DEL = { __delete__: true };
  // A status change also keeps the day fields the skill relies on.
  function statusPatch(c, status) {
    const p = { status, at: today() };
    if (status === "doing" && !c.started) p.started = today();
    if (status === "done" || status === "dropped") p.closed = today();
    return p;
  }

  /* ---------- actions ---------- */
  function addTask(raw) {
    const key = state.key;
    const lines = raw.split("\n");
    const first = lines.shift().trim();
    let rest = lines.join("\n").trim();
    let title = first;
    if (title.length > 90) {
      // A long first line stays whole in the description; the card gets its opening words.
      const cut = title.slice(0, 84);
      const sp = cut.lastIndexOf(" ");
      title = (sp > 50 ? cut.slice(0, sp) : cut) + "…";
      rest = rest ? first + "\n" + rest : first;
    }
    let n = Number(state.project && state.project.seq) || 0;
    let top = 0;
    for (const m of [state.open, state.later, state.closed]) {
      for (const [id, c] of m) {
        if (Number.isFinite(num(id))) n = Math.max(n, num(id));
        if (!isClosed(c)) top = Math.max(top, ord(c));
      }
    }
    n += 1;
    const id = "t" + String(n).padStart(3, "0");
    const body = { title, status: "inbox", ball: "agent", order: top + 10, src: "user", created: today(), at: today() };
    if (rest) body.brief = true;
    if (state.ms) body.milestone = state.ms;
    state.open.set(id, body);
    write(taskPath(key, id), () => state.db.doc(taskPath(key, id)).set(body));
    if (rest) write(briefPath(key, id), () => state.db.doc(briefPath(key, id)).set({ text: rest }));
    write(pPath(key), () => state.db.doc(pPath(key)).update({ seq: n }));
    state.flash = key + "/" + id;
    setTimeout(() => { if (state.flash === key + "/" + id) { state.flash = null; } }, 1600);
    render();
  }

  // Puts a card into the queue between two cards the viewer sees; either may be null.
  function placeInQueue(id, prevId, nextId) {
    const key = state.key;
    const c = cardOf(key, id);
    if (!c || !state.db) return;
    const inQueue = state.open.has(id) && sectionOf(c) === "queue";
    const full = listOf("queue", true).filter((x) => x[0] !== id);
    let idx = full.length;
    const at = (w) => full.findIndex((x) => x[0] === w);
    if (nextId && at(nextId) >= 0) idx = at(nextId);
    else if (prevId && at(prevId) >= 0) idx = at(prevId) + 1;
    if (inQueue && listOf("queue", true).findIndex((x) => x[0] === id) === idx) return;
    const extra = inQueue ? {} : { ...statusPatch(c, "todo"), ball: "agent" };
    const prev = idx > 0 ? ord(full[idx - 1][1]) : null;
    const next = idx < full.length ? ord(full[idx][1]) : null;
    let order = null;
    if (prev == null && next == null) order = 10;
    else if (prev == null) order = next - 10;
    else if (next == null) order = prev + 10;
    else if ((prev + next) / 2 > prev && (prev + next) / 2 < next) order = (prev + next) / 2;
    if (order != null) { patchTask(key, id, { ...extra, order }); return; }
    // Neighbours share a number: give the whole queue fresh ones.
    const ids = full.map((x) => x[0]);
    ids.splice(idx, 0, id);
    ids.forEach((x, i) => {
      const want = (i + 1) * 10;
      if (x === id) patchTask(key, x, { ...extra, order: want });
      else if (ord(cardOf(key, x)) !== want) patchTask(key, x, { order: want });
    });
  }
  function nudge(how) {
    const s = state.sel;
    if (!s || s.key !== state.key) return;
    const seen = listOf("queue").map((x) => x[0]);
    const i = seen.indexOf(s.id);
    if (i < 0) return;
    const others = seen.filter((x) => x !== s.id);
    const j = how === "top" ? 0 : how === "up" ? i - 1 : i + 1;
    if (j < 0 || j > others.length || j === i) return;
    placeInQueue(s.id, j > 0 ? others[j - 1] : null, j < others.length ? others[j] : null);
  }

  let briefTimer = null;
  function stopBriefTimer() { if (briefTimer) { clearTimeout(briefTimer); briefTimer = null; } }
  function watchBrief(sel) {
    if (state.briefUnsub) { state.briefUnsub(); state.briefUnsub = null; }
    const ta = $("f-brief");
    ta.value = "";
    state.briefText = "";
    state.briefDirty = false;
    if (!sel || !state.db) return;
    let first = true;
    state.briefUnsub = state.db.doc(briefPath(sel.key, sel.id)).onSnapshot((snap) => {
      if (state.sel !== sel) return;
      const d = snap.exists ? snap.data() : null;
      state.briefText = d && typeof d.text === "string" ? d.text : "";
      // Never replace text the viewer is in the middle of typing.
      if (!state.briefDirty && (first || document.activeElement !== ta)) ta.value = state.briefText;
      first = false;
    }, () => {});
  }
  function saveBrief(sel, raw) {
    const c = cardOf(sel.key, sel.id);
    if (!c || !state.db || !state.canWrite) return;
    const text = raw.replace(/\s+$/, "");
    state.briefDirty = false;
    if (text === state.briefText) return;
    state.briefText = text;
    const path = briefPath(sel.key, sel.id);
    if (text) {
      write(path, () => state.db.doc(path).set({ text }));
      if (!c.brief) patchTask(sel.key, sel.id, { brief: true });
    } else {
      write(path, () => state.db.doc(path).delete());
      if (c.brief) patchTask(sel.key, sel.id, { brief: false });
    }
  }

  function resetDel() { $("del").hidden = false; $("del-confirm").hidden = true; }
  function select(key, id, focusId) {
    if (!cardOf(key, id)) return;
    state.sel = { key, id };
    resetDel();
    stopBriefTimer();
    $("deps-hint").hidden = true;
    $("save-state").textContent = "";
    watchBrief(state.sel);
    if (!dlg.open) dlg.showModal();
    fillDetail(true);
    (focusId ? $(focusId) : dlg).focus();
  }
  function deselect() {
    // A field still being typed in commits on blur, while the card is still selected.
    const active = document.activeElement;
    if (active && dlg.contains(active) && active !== dlg) active.blur();
    state.sel = null;
    stopBriefTimer();
    watchBrief(null);
    if (dlg.open) dlg.close();
  }

  /* ---------- events: page ---------- */
  function openFrom(e) {
    const r = e.target.closest ? e.target.closest(".card") : null;
    if (!r) return;
    const c = cardOf(r.dataset.key, r.dataset.id);
    const asks = c && ballOf(c) === "user" && !c.reply && state.canWrite;
    select(r.dataset.key, r.dataset.id, asks ? "f-reply" : null);
  }
  wrap.addEventListener("click", (e) => {
    if (e.target.closest(".card")) { openFrom(e); return; }
    const p = e.target.closest("#projects .seg");
    if (p) { pick(p.dataset.key); return; }
    const m = e.target.closest(".ms");
    if (m) { state.ms = state.ms === m.dataset.ms ? "" : m.dataset.ms; render(); }
  });
  wrap.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    if (e.target.classList && e.target.classList.contains("card")) { e.preventDefault(); openFrom(e); }
    else if (e.target.classList && e.target.classList.contains("ms")) { e.preventDefault(); e.target.click(); }
  });
  $("q").addEventListener("input", () => {
    state.q = $("q").value.trim().toLocaleLowerCase(t("locale"));
    renderSummary();
    renderLists();
  });
  $("lang").addEventListener("click", () => {
    lang = lang === "tr" ? "en" : "tr";
    pref("lang", lang);
    applyStatic();
    render();
    if (state.sel) fillDetail(true);
  });
  $("add-title").addEventListener("input", () => grow($("add-title"), 280));
  $("add-title").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      $("add-form").requestSubmit();
    }
  });
  $("add-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const inp = $("add-title");
    const raw = inp.value.trim();
    if (!raw || !state.db || !state.canWrite || !state.loaded || !state.key) return;
    inp.value = "";
    grow(inp, 280);
    addTask(raw);
  });
  for (const [fold, key] of [["fold-external", null], ["fold-later", "laterOn"], ["fold-closed", "closedOn"]]) {
    const d = $(fold);
    if (pref(fold) === "1") d.open = true;
    d.addEventListener("toggle", () => {
      pref(fold, d.open ? "1" : "0");
      if (key && d.open && !state[key]) { state[key] = true; subscribeFolds(); }
    });
  }
  $("more-closed").addEventListener("click", () => {
    state.closedLimit += CLOSED_PAGE;
    subscribeFolds(true);
  });

  /* ---------- events: drag a card into the queue ---------- */
  const dropLine = el("div", "drop-line");
  dropLine.hidden = true;
  let drag = null;
  function clearDrag() {
    for (const c of document.querySelectorAll(".card.dragging")) c.classList.remove("dragging");
    dropLine.hidden = true;
    drag = null;
  }
  document.addEventListener("dragstart", (e) => {
    const r = e.target.closest ? e.target.closest(".card") : null;
    if (!r || !r.draggable || !state.canWrite) return;
    drag = { id: r.dataset.id, prevId: null, nextId: null };
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", r.dataset.id);
    requestAnimationFrame(() => r.classList.add("dragging"));
  });
  document.addEventListener("dragend", clearDrag);
  const queueBox = $("cards-queue");
  queueBox.addEventListener("dragover", (e) => {
    if (!drag) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    const cards = [...queueBox.querySelectorAll(".card")].filter((c) => c.dataset.id !== drag.id);
    let idx = cards.length;
    for (let i = 0; i < cards.length; i += 1) {
      const r = cards[i].getBoundingClientRect();
      if (e.clientY < r.top + r.height / 2) { idx = i; break; }
    }
    drag.nextId = idx < cards.length ? cards[idx].dataset.id : null;
    drag.prevId = idx > 0 ? cards[idx - 1].dataset.id : null;
    if (dropLine.parentNode !== queueBox) queueBox.append(dropLine);
    let y = 0;
    if (idx < cards.length) y = cards[idx].offsetTop - 4;
    else if (cards.length) y = cards[cards.length - 1].offsetTop + cards[cards.length - 1].offsetHeight + 4;
    dropLine.style.top = (y - 1.5) + "px";
    dropLine.hidden = false;
  });
  queueBox.addEventListener("dragleave", (e) => {
    if (!e.relatedTarget || !queueBox.contains(e.relatedTarget)) dropLine.hidden = true;
  });
  queueBox.addEventListener("drop", (e) => {
    if (!drag) return;
    e.preventDefault();
    const d = drag;
    clearDrag();
    placeInQueue(d.id, d.prevId, d.nextId);
  });

  /* ---------- events: card dialog ---------- */
  dlg.addEventListener("cancel", (e) => { e.preventDefault(); deselect(); });
  dlg.addEventListener("click", (e) => { if (e.target === dlg) deselect(); });
  $("detail-close").addEventListener("click", deselect);
  $("detail-form").addEventListener("submit", (e) => e.preventDefault());

  const RESTORE = {};
  const splitList = (v) => [...new Set(v.split(/[\s,;]+/).map((x) => x.trim()).filter(Boolean))];
  function onField(fieldId, make) {
    const f = $(fieldId);
    f.addEventListener("change", () => {
      const s = state.sel;
      const c = s && cardOf(s.key, s.id);
      if (!c || !state.db || !state.canWrite) return;
      const patch = make(f.value, c, s);
      if (patch === RESTORE) { fillDetail(true); return; }
      if (!patch) return;
      const real = {};
      let n = 0;
      for (const k of Object.keys(patch)) {
        const v = patch[k];
        const empty = v === "" || (Array.isArray(v) && !v.length);
        if (empty && c[k] == null) continue;
        if (!same(c[k], v)) { real[k] = empty ? DEL : v; n += 1; }
      }
      if (n) patchTask(s.key, s.id, real);
    });
    if (f.tagName === "INPUT" || f.id === "f-title") {
      f.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); f.blur(); } });
    }
  }
  onField("f-title", (v) => (v.trim() ? { title: v.replace(/\s+/g, " ").trim() } : RESTORE));
  onField("f-waiting", (v) => ({ waiting: v.trim() }));
  onField("f-reply", (v) => ({ reply: v.trim() }));
  onField("f-milestone", (v) => ({ milestone: v }));
  onField("f-area", (v) => ({ area: v.trim() }));
  onField("f-kind", (v) => ({ kind: v }));
  onField("f-owner", (v) => ({ owner: v.trim() }));
  onField("f-note", (v) => ({ note: v.trim() }));
  onField("f-prs", (v) => ({ prs: splitList(v.replace(/#/g, "")).map((x) => (/^\d+$/.test(x) ? Number(x) : x)) }));
  onField("f-reqs", (v) => ({ reqs: v.split(/[,;]+/).map((x) => x.trim()).filter(Boolean) }));
  onField("f-deps", (v, c, s) => {
    const ids = splitList(v);
    const hint = $("deps-hint");
    if (ids.includes(s.id)) { hint.textContent = t("depsSelf"); hint.hidden = false; return null; }
    hint.hidden = true;
    return { deps: ids };
  });
  $("f-title").addEventListener("input", () => grow($("f-title"), 240));
  $("f-status").addEventListener("click", (e) => {
    const b = e.target.closest("[data-status]");
    const s = state.sel;
    const c = s && cardOf(s.key, s.id);
    if (!b || !c || !state.db || !state.canWrite || b.dataset.status === statusOf(c)) return;
    patchTask(s.key, s.id, statusPatch(c, b.dataset.status));
  });
  $("f-ball").addEventListener("click", (e) => {
    const b = e.target.closest("[data-ball]");
    const s = state.sel;
    const c = s && cardOf(s.key, s.id);
    if (!b || !c || !state.db || !state.canWrite || b.dataset.ball === c.ball) return;
    patchTask(s.key, s.id, { ball: b.dataset.ball });
  });
  $("f-brief").addEventListener("input", () => {
    const s = state.sel;
    state.briefDirty = true;
    stopBriefTimer();
    briefTimer = setTimeout(() => { briefTimer = null; if (state.sel === s) saveBrief(s, $("f-brief").value); }, 1500);
  });
  $("f-brief").addEventListener("change", () => { stopBriefTimer(); if (state.sel) saveBrief(state.sel, $("f-brief").value); });
  $("mv-top").addEventListener("click", () => nudge("top"));
  $("mv-up").addEventListener("click", () => nudge("up"));
  $("mv-down").addEventListener("click", () => nudge("down"));
  $("del").addEventListener("click", () => { $("del").hidden = true; $("del-confirm").hidden = false; });
  $("del-no").addEventListener("click", resetDel);
  $("del-yes").addEventListener("click", () => {
    const s = state.sel;
    if (!s || !state.db) return;
    deselect();
    state.open.delete(s.id);
    state.later.delete(s.id);
    state.closed.delete(s.id);
    write(taskPath(s.key, s.id), () => state.db.doc(taskPath(s.key, s.id)).delete());
    write(briefPath(s.key, s.id), () => state.db.doc(briefPath(s.key, s.id)).delete());
    resetDel();
    render();
  });

  /* ---------- events: project dialog ---------- */
  const pDlg = $("project-dialog");
  $("edit-project").addEventListener("click", () => {
    const p = state.project || {};
    $("p-name").value = p.name || "";
    $("p-goal").value = p.goal || "";
    $("p-counters").value = Object.entries(p.counters || {}).map(([k, v]) => k + " = " + v).join("\n");
    $("p-err").hidden = true;
    pDlg.showModal();
  });
  $("p-cancel").addEventListener("click", () => pDlg.close());
  pDlg.addEventListener("click", (e) => { if (e.target === pDlg) pDlg.close(); });
  $("project-form").addEventListener("submit", (e) => {
    e.preventDefault();
    if (!state.db || !state.key) return;
    const counters = {};
    for (const raw of $("p-counters").value.split("\n")) {
      const line = raw.trim();
      if (!line) continue;
      const m = /^([^=:]+?)\s*[=:]\s*(\d+)$/.exec(line);
      if (!m) { $("p-err").hidden = false; return; }
      counters[m[1].trim()] = Number(m[2]);
    }
    const key = state.key;
    const next = { name: $("p-name").value.trim(), goal: $("p-goal").value.trim(), counters };
    const dropped = Object.keys((state.project && state.project.counters) || {}).some((k) => !(k in counters));
    write(pPath(key), async () => {
      const ref = state.db.doc(pPath(key));
      // update() merges nested objects, so a removed counter needs a full replace.
      if (state.project && !dropped) await ref.update(next);
      else await ref.set({ ...(state.project || {}), ...next });
    });
    pDlg.close();
  });

  /* ---------- export: the project as one JSON file ---------- */
  $("export").addEventListener("click", async () => {
    const key = state.key;
    if (!key || !state.db) return;
    const downloads = await window.claude.use("downloads");
    if (!downloads) { say("export", t("exNo")); return; }
    say("export", t("exBusy"));
    let truncated = false;
    const grab = async (q) => {
      const snap = await q.limit(1000).get();
      if (snap.size >= 1000) truncated = true;
      const out = {};
      for (const d of snap.docs) out[d.id] = d.data();
      return out;
    };
    try {
      const base = pPath(key);
      const project = await state.db.doc(base).get();
      const tasks = {};
      for (const group of [OPEN, ["later"], ["done", "dropped"]]) {
        Object.assign(tasks, await grab(state.db.collection(base + "/tasks").where("status", "in", group).orderBy("order")));
      }
      const dump = {
        exported: new Date().toISOString(), project: key,
        document: project.exists ? project.data() : null,
        milestones: await grab(state.db.collection(base + "/milestones").orderBy("order")),
        tasks,
        briefs: await grab(state.db.collection(base + "/briefs")),
        waves: await grab(state.db.collection(base + "/waves").orderBy("at")),
      };
      await downloads.save({ filename: key + "-" + today() + ".json", data: JSON.stringify(dump, null, 2) });
      say("export", truncated ? t("exTrunc") : t("exDone"));
    } catch (err) {
      const code = err && err.code;
      if (code === "declined") say("export", "");
      else if (code === "unavailable" || code === "not_granted") say("export", t("exNo"));
      else say("export", t("dead"));
    }
  });

  /* ---------- subscriptions ---------- */
  let loadTimer = null;
  function settled(snap) {
    if (snap.metadata && snap.metadata.fromCache) return;
    if (loadTimer) { clearTimeout(loadTimer); loadTimer = null; }
    if (noticeKind === "load") say("load", "");
  }
  function dead() {
    if (loadTimer) { clearTimeout(loadTimer); loadTimer = null; }
    say("load", t("dead"));
  }
  const toMap = (snap) => { const m = new Map(); for (const d of snap.docs) m.set(d.id, d.data()); return m; };

  // One small query per project: the cards whose move is the user's.
  function syncTurnSubs() {
    for (const [key, un] of subs.turn) {
      if (!state.projects.has(key)) { un(); subs.turn.delete(key); state.turn.delete(key); }
    }
    for (const key of state.projects.keys()) {
      if (subs.turn.has(key)) continue;
      subs.turn.set(key, state.db.collection(pPath(key) + "/tasks").where("ball", "==", "user").limit(200)
        .onSnapshot((snap) => { state.turn.set(key, toMap(snap)); render(); }, () => {}));
    }
  }

  function unsubProject() {
    for (const un of subs.project) un();
    subs.project = [];
    for (const un of subs.msDone.values()) un();
    subs.msDone.clear();
    if (subs.later) { subs.later(); subs.later = null; }
    if (subs.closed) { subs.closed(); subs.closed = null; }
  }

  function syncMsDone() {
    const base = pPath(state.key) + "/tasks";
    for (const [id, un] of subs.msDone) {
      if (!state.milestones.has(id) || state.milestones.get(id).state === "closed") { un(); subs.msDone.delete(id); }
    }
    for (const [id, m] of state.milestones) {
      if (m.state === "closed" || subs.msDone.has(id)) continue;
      subs.msDone.set(id, state.db.collection(base).where("milestone", "==", id).where("status", "in", ["done", "dropped"]).limit(1000)
        .onSnapshot((snap) => { state.msDone.set(id, snap.size); renderMilestones(); }, () => {}));
    }
  }

  function subscribeFolds(again) {
    if (!state.key || !state.db) return;
    const base = pPath(state.key) + "/tasks";
    if (state.laterOn && !subs.later) {
      subs.later = state.db.collection(base).where("status", "==", "later").orderBy("order").limit(500)
        .onSnapshot((snap) => { state.later = toMap(snap); render(); }, () => {});
    }
    if (state.closedOn && (!subs.closed || again)) {
      if (subs.closed) subs.closed();
      const limit = state.closedLimit;
      subs.closed = state.db.collection(base).where("status", "in", ["done", "dropped"]).orderBy("closed", "desc").limit(limit)
        .onSnapshot((snap) => { state.closed = toMap(snap); state.closedFull = snap.size >= limit; render(); }, () => {});
    }
  }

  function pick(key) {
    if (!key || key === state.key) return;
    if (state.sel && state.sel.key === state.key) deselect();
    unsubProject();
    Object.assign(state, {
      key, project: null, projectLoaded: false, loaded: false, ms: "",
      milestones: new Map(), waves: new Map(), msDone: new Map(),
      open: new Map(), later: new Map(), closed: new Map(), closedLimit: CLOSED_PAGE, closedFull: false,
    });
    pref("project", key);
    const base = pPath(key);
    const db = state.db;
    subs.project.push(db.doc(base).onSnapshot((snap) => {
      state.project = snap.exists ? { ...snap.data() } : null;
      state.projectLoaded = true;
      settled(snap);
      renderHeader();
    }, dead));
    subs.project.push(db.collection(base + "/milestones").orderBy("order").limit(200).onSnapshot((snap) => {
      state.milestones = toMap(snap);
      syncMsDone();
      render();
    }, () => {}));
    subs.project.push(db.collection(base + "/waves").where("state", "!=", "closed").limit(50).onSnapshot((snap) => {
      state.waves = toMap(snap);
      renderWaves();
    }, () => {}));
    subs.project.push(db.collection(base + "/tasks").where("status", "in", OPEN).orderBy("order").limit(1000).onSnapshot((snap) => {
      state.open = toMap(snap);
      state.loaded = true;
      settled(snap);
      render();
    }, dead));
    subscribeFolds();
    render();
  }

  /* ---------- boot ---------- */
  function readOnly() {
    state.canWrite = false;
    wrap.classList.add("ro");
    for (const f of document.querySelectorAll("#detail-form input, #detail-form textarea, #detail-form select, #f-status button, #f-ball button")) f.disabled = true;
    renderLists();
  }

  async function boot() {
    applyStatic();
    state.laterOn = $("fold-later").open;
    state.closedOn = $("fold-closed").open;
    render();
    const claude = window.claude;
    const db = claude && typeof claude.use === "function" ? await claude.use("db") : null;
    if (!db) {
      state.loaded = true;
      state.projectsLoaded = true;
      readOnly();
      render();
      say("load", t("noDb"));
      return;
    }
    state.db = db;
    loadTimer = setTimeout(() => say("load", t("slow")), 10000);
    db.collection("projects").limit(100).onSnapshot((snap) => {
      state.projects = toMap(snap);
      state.projectsLoaded = true;
      settled(snap);
      syncTurnSubs();
      if (!state.key || !state.projects.has(state.key)) {
        const saved = pref("project");
        const keys = [...state.projects.keys()].sort((a, b) => projName(a).localeCompare(projName(b), t("locale")));
        const want = saved && state.projects.has(saved) ? saved : keys[0];
        if (want) pick(want);
        else { state.key = null; state.loaded = true; render(); }
      } else {
        state.project = state.projects.get(state.key);
        render();
      }
    }, dead);
    const user = await claude.use("user");
    const can = user ? await user.can("data.write") : null;
    if (can === false) readOnly();
  }
  boot();
})();
</script>
